name: Automated Release

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install NSIS compiler
        shell: pwsh
        run: |
          if (-not (Get-Command "makensis" -ErrorAction SilentlyContinue)) {
            choco install nsis -y
            $nsisDir = "C:\Program Files (x86)\NSIS"
            if (Test-Path $nsisDir) {
              echo "$nsisDir" >> $env:GITHUB_PATH
            }
          }

      - name: Set Version
        shell: pwsh
        # This generates a version like v1.0.1, v1.0.2 based on the GitHub run number
        run: echo "VERSION=v1.0.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Build Portable Windows Bundle & Installer
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            **For Teachers (Zero-Setup):**
            1. Download `TeacherAssistant-Setup.exe` (installer) or `TeacherAssistant-v1.0.0-Windows-Portable.zip`.
            2. Run the installer or extract the zip and double-click `start-app.bat`.
               - Or double-click `start-internal-site.bat` to host for the whole classroom/school over Wi-Fi.
            3. The app will configure itself automatically and open `http://127.0.0.1:3000` in your browser.
            4. Initial login:
               - **Username:** `admin`
               - **Password:** `admin123` (or custom value if you configured `.env`)
            5. Change your password after login via **Admin Dashboard → Settings**.

            ---
            ### 📝 Changelog

          generateReleaseNotes: true
          prerelease: false
          makeLatest: true
          artifacts: "release/*.*"
          token: ${{ secrets.GITHUB_TOKEN }}

